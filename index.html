<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helena Corrêa - Social Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('assets/bg.png');
            /* imagem de fundo */
            background-size: cover;
            background-position: center;
        }
    </style>
</head>

<body class="text-white font-sans flex flex-col items-center min-h-screen px-4 py-8 bg-black/80">
    <div class="w-full max-w-md md:max-w-xl flex flex-col items-center">
        <!-- Avatar e Nome -->
        <div class="flex flex-col items-center mb-10">
            <img src="assets/avatar.png" alt="Helena"
                class="w-28 h-28 md:w-36 md:h-36 rounded-full object-cover border-4 border-white" />
            <h1 class="mt-4 font-bold text-lg md:text-2xl uppercase tracking-wide text-center">Helena Corrêa</h1>
            <p class="italic text-center text-lg md:text-xl">Social Media Estratégico</p>
        </div>

        <!-- Botões -->
        <div class="space-y-6 w-full px-2">
            <!-- Botão 1 -->
            <a href="#"
                class="bg-[#793737] rounded-xl flex justify-between items-center p-4 md:p-6 shadow-lg transition hover:scale-[1.02]">
                <div class="font-bold text-left text-sm md:text-lg leading-tight">
                    <p>CONTATO</p>
                    <p>VIA WHATSAPP</p>
                </div>
                <img src="assets/avatar1.png" alt="Emoji 1" class="w-16 h-16 md:w-20 md:h-20 object-contain" />
            </a>

            <!-- Botão 2 -->
            <a href="#"
                class="bg-[#793737] rounded-xl flex justify-between items-center p-4 md:p-6 shadow-lg transition hover:scale-[1.02]">
                <div class="font-bold text-left text-sm md:text-lg leading-tight">
                    <p>FORMS PARA</p>
                    <p>ATENDIMENTOS</p>
                </div>
                <img src="assets/avatar2.png" alt="Emoji 2" class="w-16 h-16 md:w-20 md:h-20 object-contain" />
            </a>

            <!-- Botão 3 -->
            <a href="#"
                class="bg-[#793737] rounded-xl flex justify-between items-center p-4 md:p-6 shadow-lg transition hover:scale-[1.02]">
                <div class="font-bold text-left text-sm md:text-lg leading-tight">
                    <p>MENTORIAS</p>
                </div>
                <img src="assets/avatar3.webp" alt="Emoji 3" class="w-28 h-28 md:w-20 md:h-20 object-contain" />
            </a>
        </div>

        <!-- Frase final -->
        <p class="mt-10 italic text-sm md:text-base text-center px-4">Não é sobre postar, é sobre planejar !</p>
    </div>
</body>

</html>
